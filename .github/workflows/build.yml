name: Build PDF E-Book

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install reportlab
    - name: Run script
      run: python generate_pdf.py
    - name: Upload PDF
      uses: actions/upload-artifact@v3
      with:
        name: God-Tier-Masterclass-PDF
        path: The_10k_Mo_Automated_Cashflow_Blueprint.pdf
